<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfoCell Viewer</title>
<style>

:root {
  --bg: #eef1f6; --panel: #ffffff; --fg: #18223a; --muted: #5d6784; --line: #d3d9e6;
  --ink: #2a3cb0; --ink-soft: #e4e8fb; --ok: #1f8a4c; --bad: #c2362b; --warn: #a86b00;
  --ui: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1320; --panel: #161d2e; --fg: #e3e8f3; --muted: #9aa4c0; --line: #2b3550;
          --ink: #93a5ff; --ink-soft: #222c4d; --ok: #4fcf86; --bad: #ff7b6e; --warn: #f0b44c; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--ui); display: grid; grid-template-rows: auto 1fr; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .02em; }
select, input[type=search] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { font: 600 13px var(--ui); border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); }
button.ghost { background: transparent; color: var(--ink); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; user-select: none; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 320px; min-height: 0; }
#list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
#list button { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; color: var(--fg); border: 0; border-radius: 0;
               font: 13px var(--mono); padding: 5px 12px; text-align: left; border-bottom: 1px solid var(--line); }
#list button:hover { background: var(--ink-soft); }
#list button.active { background: var(--ink); color: var(--panel); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.s-solved { background: var(--ok); } .s-wrong { background: var(--bad); } .s-noprogram { background: var(--muted); } .s-unknown { background: var(--warn); }
#main { overflow-y: auto; padding: 18px 22px 60px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
#main > * { flex-shrink: 0; }
#inspector { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
h2 { font-size: 15px; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.task-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.task-head .id { font: 600 20px var(--mono); }
.chip { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; }
.chip.solved { color: var(--ok); } .chip.wrong { color: var(--bad); } .chip.noprogram { color: var(--muted); } .chip.unknown { color: var(--warn); } .chip.running { color: var(--ink); }
.muted { color: var(--muted); }
.pairs { display: flex; flex-wrap: wrap; gap: 14px; }
.pair { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; gap: 10px; align-items: center; }
.gridbox { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.gridbox .cap { font-size: 12px; color: var(--muted); }
.arrow { color: var(--muted); font-size: 18px; }
canvas { display: block; cursor: crosshair; image-rendering: pixelated; }
.programs { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
tr.prog { cursor: pointer; }
tr.prog:hover { background: var(--ink-soft); }
tr.prog.sel { background: var(--ink-soft); box-shadow: inset 3px 0 0 var(--ink); }
td.rule { font: 13px var(--mono); white-space: pre-wrap; word-break: break-word; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.card.pin { border-color: var(--ink); background: var(--ink-soft); }
.card h3 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.slots { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.slots dt { color: var(--muted); } .slots dd { margin: 0; font-family: var(--mono); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; border: 1px solid var(--line); margin-right: 4px; }
.objlist { display: flex; flex-wrap: wrap; gap: 4px; }
.objlist button { background: none; color: var(--fg); border: 1px solid var(--line); font: 12px var(--mono); padding: 2px 7px; }
.objlist button.on { border-color: var(--ink); color: var(--ink); }
.note { font-size: 12px; color: var(--muted); }
.err { color: var(--bad); white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.empty { color: var(--muted); padding: 40px 0; }
.tabs { display: flex; gap: 4px; margin-right: 8px; }
.tabs button { background: transparent; color: var(--muted); border-color: var(--line); }
.tabs a.tablink { font: 600 13px var(--ui); color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
.tabs a.tablink:hover { color: var(--ink); border-color: var(--ink); }
body.no-solver .solver-only { display: none !important; }
.tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
#list .group { font: 600 11px var(--ui); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 10px 12px 4px; border-bottom: 1px solid var(--line); }
a.tlink { color: var(--ink); text-decoration: none; cursor: pointer; } a.tlink:hover { text-decoration: underline; }
.kv { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; background: var(--panel); }
.tag.ink { border-color: var(--ink); color: var(--ink); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow-x: auto; }
.box svg { display: block; max-width: 100%; height: auto; }
.box svg text { font: 12px var(--ui); fill: var(--fg); }
.box svg .lbl { fill: var(--muted); font-size: 11px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 18px; }
@media (max-width: 1100px) { .layout { grid-template-columns: 180px minmax(0, 1fr); } #inspector { display: none; } }
</style>
</head>
<body>
<header>
  <h1>InfoCell Viewer</h1>
  <nav class="tabs" aria-label="Pages"><button id="tabTasks" type="button">Tasks</button><button id="tabTypes" type="button">Cell types</button><button id="tabTools" type="button">ToolFinder</button><button id="tabGrammar" type="button">Grammar</button><a class="tablink" href="/concept" target="_blank" rel="noopener">Concept</a></nav>
  <span id="taskControls" style="display:contents">
  <select id="set" aria-label="Task set"></select>
  <input id="filter" type="search" placeholder="Filter task id" aria-label="Filter task id">
  <select id="statusFilter" aria-label="Filter by result" class="solver-only">
    <option value="">All tasks</option><option value="solved">Solved</option><option value="wrong">Wrong</option>
    <option value="no program">No program</option><option value="unsolved">Not run yet</option>
  </select>
  <span id="counts" class="muted solver-only"></span>
  <span style="flex:1"></span>
  <label class="toggle"><input id="tObjects" type="checkbox" checked> Object cells</label>
  <label class="toggle"><input id="tChanges" type="checkbox" checked> Changed pixels</label>
  <label class="toggle solver-only"><input id="tAuto" type="checkbox" checked> Solve on open</label>
  </span>
  <span id="typeControls" style="display:none">
    <input id="typeFilter" type="search" placeholder="Filter types" aria-label="Filter types">
    <label class="toggle"><input id="tInstances" type="checkbox"> Template instances</label>
  </span>
</header>
<div class="layout">
  <nav id="list" aria-label="Tasks"></nav>
  <main id="main"><div class="empty">Pick a task on the left. Use ↑ ↓ to step through the list.</div></main>
  <aside id="inspector" aria-label="Cell inspector">
    <h2>Cells</h2>
    <div id="insp" class="note">Hover over a pixel to see its Pixel cell, its object cell and the Grid cell. Click to pin an object.</div>
  </aside>
</div>
<script>
const ARC = ["#000000","#1e93ff","#f93c31","#4fcc30","#ffdc00","#999999","#e53aa3","#ff851b","#87d8f1","#921231"];
const CNAME = ["black","blue","red","green","yellow","grey","magenta","orange","sky","maroon"];
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(k => { if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(k)); });
  return e;
};
const statusClass = s => s ? "s-" + s.replace(" ", "") : "";

let caps = { solve: false, toolfinder: false, types: false, grammar: false };
let sets = [], cur = { set: null, id: null, task: null, result: null, prog: null };
let pinned = null;
const grids = new Map();

// ---------- task list ----------
async function loadSets() {
  sets = await (await fetch("/api/sets")).json();
  $("#set").replaceChildren(...sets.map(s => h("option", { value: s.key, disabled: !s.found }, s.label + (s.found ? ` (${s.tasks.length})` : " (missing)"))));
  const [hs, hid] = decodeURIComponent(location.hash.slice(1)).split("/");
  const first = sets.find(s => s.key === hs && s.found) || sets.find(s => s.found);
  if (first) { $("#set").value = first.key; if (!/^#(types|tools|grammar)/.test(location.hash)) { renderList(); if (hid) openTask(first.key, hid); } }
}
function currentSet() { return sets.find(s => s.key === $("#set").value); }
function visibleTasks() {
  const s = currentSet(); if (!s) return [];
  const f = $("#filter").value.trim().toLowerCase(), st = $("#statusFilter").value;
  return s.tasks.filter(t => (!f || t.id.includes(f)) && (!st || (st === "unsolved" ? !t.status : t.status === st)));
}
function renderList() {
  if (mode !== "tasks") return;
  const s = currentSet(), list = $("#list");
  list.replaceChildren(...visibleTasks().map(t => h("button", {
    class: s.key === cur.set && t.id === cur.id ? "active" : "", "data-id": t.id, onclick: () => openTask(s.key, t.id)
  }, t.id, h("span", { class: "dot " + statusClass(t.status), title: t.status || "not run yet" }))));
  const c = { solved: 0, wrong: 0, "no program": 0 };
  s.tasks.forEach(t => { if (t.status in c) c[t.status]++; });
  const run = c.solved + c.wrong + c["no program"];
  $("#counts").textContent = run ? `${c.solved} solved · ${c.wrong} wrong · ${c["no program"]} no program · of ${run} run` : "";
}
$("#set").addEventListener("change", renderList);
$("#filter").addEventListener("input", renderList);
$("#statusFilter").addEventListener("change", renderList);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && pinned) { pinned = null; redrawAll(); inspect(); return; }
  if (mode !== "tasks" || !["ArrowDown", "ArrowUp"].includes(e.key) || e.target.matches("input, select")) return;
  const ts = visibleTasks(), i = ts.findIndex(t => t.id === cur.id);
  const n = ts[Math.max(0, Math.min(ts.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
  if (n) { e.preventDefault(); openTask(currentSet().key, n.id); }
});

// ---------- cells ----------
const cellCache = new WeakMap();
function cellsOf(g) {
  if (cellCache.has(g)) return cellCache.get(g);
  const H = g.length, W = g[0].length, flat = g.flat();
  const hist = new Map(); flat.forEach(c => hist.set(c, (hist.get(c) || 0) + 1));
  const bg = hist.has(0) ? 0 : [...hist.entries()].sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
  const seen = g.map(r => r.map(() => false)), objs = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (seen[y][x] || g[y][x] === bg) continue;
    const px = [], stack = [[x, y]]; seen[y][x] = true;
    while (stack.length) {
      const [cx, cy] = stack.pop(); px.push([cx, cy]);
      for (const [dx, dy] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen[ny][nx] || g[ny][nx] !== g[cy][cx]) continue;
        seen[ny][nx] = true; stack.push([nx, ny]);
      }
    }
    objs.push(px);
  }
  const sizes = objs.map(o => o.length), count = n => sizes.filter(s => s === n).length;
  const maxS = Math.max(0, ...sizes), minS = Math.min(Infinity, ...sizes);
  const objects = objs.map((px, id) => {
    const xs = px.map(p => p[0]), ys = px.map(p => p[1]);
    const box = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], w = box[2] - box[0] + 1, h = box[3] - box[1] + 1;
    const mine = new Set(px.map(([x, y]) => x + "," + y)), out = new Set(), st = [];
    for (let y = box[1]; y <= box[3]; y++) for (let x = box[0]; x <= box[2]; x++)
      if ((x === box[0] || y === box[1] || x === box[2] || y === box[3]) && !mine.has(x + "," + y)) { out.add(x + "," + y); st.push([x, y]); }
    while (st.length) {
      const [x, y] = st.pop();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, k = nx + "," + ny;
        if (nx < box[0] || ny < box[1] || nx > box[2] || ny > box[3] || out.has(k) || mine.has(k)) continue;
        out.add(k); st.push([nx, ny]);
      }
    }
    return { id, pixels: px, colors: [...new Set(px.map(([x, y]) => g[y][x]))].sort((a, b) => a - b), size: px.length, box, width: w, height: h,
      touchesBorder: px.some(([x, y]) => x === 0 || y === 0 || x === W - 1 || y === H - 1),
      sizeRank: 1 + sizes.filter(s => s > px.length).length,
      largest: px.length === maxS && count(maxS) === 1, smallest: px.length === minS && count(minS) === 1,
      holes: w * h - px.length - out.size, rectangle: px.length === w * h };
  });
  const cells = { background: bg, width: W, height: H, objectCount: objects.length, objects };
  cellCache.set(g, cells);
  return cells;
}

// ---------- grids ----------
function cellSize(g, max) { const n = Math.max(g.length, g[0].length); return Math.max(4, Math.min(28, Math.floor(max / n))); }
function ownerMap(cells, g) {
  const own = g.map(r => r.map(() => -1));
  (cells?.objects || []).forEach(o => o.pixels.forEach(([x, y]) => own[y][x] = o.id));
  return own;
}
function gridView(key, g, cells, caption, opts = {}) {
  const cs = cellSize(g, opts.max || 220), H = g.length, W = g[0].length;
  const canvas = h("canvas", { width: W * cs, height: H * cs, "aria-label": caption });
  const own = ownerMap(cells, g);
  const entry = { canvas, grid: g, cells, cs, own, caption, key };
  entry.draw = () => {
    const c = canvas.getContext("2d");
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { c.fillStyle = ARC[g[y][x]] || "#fff"; c.fillRect(x * cs, y * cs, cs, cs); }
    if (cs >= 6) { c.strokeStyle = "rgba(128,128,128,.35)"; c.lineWidth = 1; c.beginPath();
      for (let x = 1; x < W; x++) { c.moveTo(x * cs + .5, 0); c.lineTo(x * cs + .5, H * cs); }
      for (let y = 1; y < H; y++) { c.moveTo(0, y * cs + .5); c.lineTo(W * cs, y * cs + .5); } c.stroke(); }
    const ref = opts.ref;
    if ($("#tChanges").checked && ref && ref.length === H && ref[0].length === W) {
      c.fillStyle = "rgba(255,255,255,.9)"; c.strokeStyle = "rgba(0,0,0,.9)";
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (ref[y][x] !== g[y][x]) {
        c.beginPath(); c.arc(x * cs + cs / 2, y * cs + cs / 2, Math.max(1.5, cs * .16), 0, 7); c.fill(); c.stroke(); }
    }
    if (opts.expected) {
      const e = opts.expected; c.strokeStyle = "#ff2d55"; c.lineWidth = Math.max(1.5, cs / 8);
      if (e.length !== H || e[0].length !== W) { c.strokeRect(1, 1, W * cs - 2, H * cs - 2); }
      else for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (e[y][x] !== g[y][x]) {
        c.beginPath(); c.moveTo(x * cs + 2, y * cs + 2); c.lineTo(x * cs + cs - 2, y * cs + cs - 2);
        c.moveTo(x * cs + cs - 2, y * cs + 2); c.lineTo(x * cs + 2, y * cs + cs - 2); c.stroke(); }
    }
    if ($("#tObjects").checked && cells) {
      const sel = pinned && pinned.key === key ? pinned.obj : (hover && hover.key === key ? own[hover.y]?.[hover.x] : -1);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const o = own[y][x]; if (o < 0) continue;
        const strong = o === sel;
        c.strokeStyle = strong ? "#ffffff" : "rgba(255,255,255,.55)"; c.lineWidth = strong ? Math.max(2, cs / 6) : 1;
        c.beginPath();
        if (own[y - 1]?.[x] !== o) { c.moveTo(x * cs, y * cs + .5); c.lineTo(x * cs + cs, y * cs + .5); }
        if (own[y + 1]?.[x] !== o) { c.moveTo(x * cs, y * cs + cs - .5); c.lineTo(x * cs + cs, y * cs + cs - .5); }
        if (own[y][x - 1] !== o) { c.moveTo(x * cs + .5, y * cs); c.lineTo(x * cs + .5, y * cs + cs); }
        if (own[y][x + 1] !== o) { c.moveTo(x * cs + cs - .5, y * cs); c.lineTo(x * cs + cs - .5, y * cs + cs); }
        c.stroke();
      }
    }
    if (hover && hover.key === key) { c.strokeStyle = "#ffffff"; c.lineWidth = 2; c.strokeRect(hover.x * cs + 1, hover.y * cs + 1, cs - 2, cs - 2); }
    if (pinned && pinned.key === key && pinned.x != null) {
      c.strokeStyle = "#ffffff"; c.lineWidth = Math.max(2, cs / 5); c.strokeRect(pinned.x * cs + 1, pinned.y * cs + 1, cs - 2, cs - 2);
      c.strokeStyle = "#2a3cb0"; c.lineWidth = 1.5; c.strokeRect(pinned.x * cs + 3, pinned.y * cs + 3, cs - 6, cs - 6);
    }
  };
  const at = e => { const r = canvas.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left) / (r.width / W)), y: Math.floor((e.clientY - r.top) / (r.height / H)) }; };
  canvas.addEventListener("mousemove", e => { const p = at(e); if (p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) return; setHover({ key, ...p }); });
  canvas.addEventListener("mouseleave", () => setHover(null));
  canvas.addEventListener("click", e => { const p = at(e), o = own[p.y]?.[p.x] ?? -1;
    const same = pinned && pinned.key === key && pinned.x === p.x && pinned.y === p.y;
    pinned = same ? null : { key, x: p.x, y: p.y, obj: o }; redrawAll(); inspect(); });
  grids.set(key, entry); entry.draw();
  return h("div", { class: "gridbox" }, canvas, h("span", { class: "cap" }, `${caption} · ${W}×${H}`));
}
let hover = null;
function setHover(p) {
  const prev = hover; hover = p;
  [prev?.key, p?.key].forEach(k => k && grids.get(k)?.draw());
  inspect();
}
function redrawAll() { grids.forEach(g => g.draw()); }
$("#tObjects").addEventListener("change", redrawAll);
$("#tChanges").addEventListener("change", redrawAll);

// ---------- inspector ----------
const sw = c => h("span", {}, h("span", { class: "sw", style: `background:${ARC[c]}` }), CNAME[c] ?? String(c));
const slots = rows => h("dl", { class: "slots" }, rows.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)]));
function objectCard(o, title, pin) {
  return h("div", { class: "card" + (pin ? " pin" : "") }, h("h3", {}, title),
    slots([["colors", h("span", {}, ...o.colors.map(sw))], ["size", String(o.size)], ["box", `${o.width}×${o.height} at (${o.box[0]},${o.box[1]})`],
      ["rectangle", o.rectangle ? "yes" : "no"], ["holes", String(o.holes)], ["touches border", o.touchesBorder ? "yes" : "no"],
      ["size rank", String(o.sizeRank)], ["largest", o.largest ? "yes" : "no"], ["smallest", o.smallest ? "yes" : "no"]]));
}
function inspect() {
  const box = $("#insp");
  const focus = pinned && pinned.x != null ? pinned : hover;
  const key = focus?.key || pinned?.key; const e = key && grids.get(key);
  if (!e) { box.replaceChildren(h("div", { class: "note" }, "Hover over a pixel to see its Pixel cell, its object cell and the Grid cell. Click a pixel to pin it; click it again or press Esc to unpin.")); return; }
  const kids = [];
  const g = e.grid, W = g[0].length, H = g.length;

let mode = "tasks", TY = null, tySel = null;

function setMode(m) {

$("#tabTasks").addEventListener("click", () => setMode("tasks"));

async function openTypes(sel) {
  if (!TY) {
    $("#main").replaceChildren(h("div", { class: "empty" }, "Loading the cell types… (the first time, the solver builds its world: a few seconds)"));
    const body = await getJson("/api/types");
    if (body.error) { $("#main").replaceChildren(h("div", { class: "err" }, body.error)); return; }
    TY = indexTypes(body);
  }
  showType(sel || (TY.solver ? "solver:overview" : "arc::Grid"));
}
function indexTypes(body) {
  const byName = new Map(body.types.map(t => [t.name, t]));
  const usedBy = new Map();
  const T = { ...body, byName, usedBy };
  body.types.forEach(t => t.members.forEach(m => tokens(m.type).forEach(tok => {
    const r = resolveType(T, tok); if (!r || r === t.name) return;
    if (!usedBy.has(r)) usedBy.set(r, []); usedBy.get(r).push({ type: t.name, slot: m.name });
  })));

}
const tokens = s => (s || "").match(/[A-Za-z_][\w]*(?:::[A-Za-z_]\w*)*/g) || [];

}

function renderTypeList() {

  }

function typeLinks(label) {

  for (const m of label.matchAll(/[A-Za-z_][\w]*(?:::[A-Za-z_]\w*)*/g)) {

  h("tbody", {}, rows.map(r => h("tr", {}, r.map(c => h("td", {}, c)))))));

function showType(sel) {

function graph(t) {

  } else if (sel === "solver:pixel") {

    kids.push(h("h2", {}, `Features a rule can read (${S.pixelFeatures.length})`));

  } else if (sel === "solver:object") {

      [fs.length > 1 ? h("details", {}, h("summary", { style: "cursor:pointer" }, k), h("div", { class: "muted", style: "font-size:12px;white-space:pre-wrap" }, fs.map(f => f.name).join("\n"))) : k,
